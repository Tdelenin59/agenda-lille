# Une entrée = un agenda .ics (donc une couleur dans Google Agenda).
# "urls" : pages programmation à lire. Le script y cherche les événements
# décrits au format schema.org (JSON-LD), présents sur beaucoup de sites
# de salles et de billetteries. Le log du run dit combien il en trouve par URL.

sources:
  - id: aeronef
    name: L'Aéronef
    urls:
      - https://aeronef.fr/agenda
      - https://www.songkick.com/venues/98792-laeronef   # secours si le site officiel ne donne rien

  - id: zenith-grand-palais
    name: Zénith & Lille Grand Palais
    urls:
      - https://www.zenithdelille.com/programmation/      # URL à confirmer au 1er run
      - https://www.lillegrandpalais.com/programmation/   # URL à confirmer au 1er run

  - id: nouveau-siecle
    name: Le Nouveau Siècle
    urls:
      - https://www.jds.fr/lille/salle-de-concert/le-nouveau-siecle-15043_L

  - id: spotlight
    name: Le Spotlight
    urls: []   # à compléter : page programmation du Spotlight

  - id: festivals
    name: Festivals Lille
    urls: []   # Series Mania, Lillarious : ajoutés à la main ci-dessous

# Événements ajoutés à la main (festivals annuels, dates connues à l'avance).
# date seule = événement sur la journée ; "end" optionnel (inclus).
manual: []
# Exemple (retire les # et le "[]" ci-dessus, puis mets les vraies dates) :
# manual:
#   - source: festivals
#     name: Series Mania
#     start: AAAA-MM-JJ
#     end: AAAA-MM-JJ
#     url: https://seriesmania.com
#   - source: festivals
#     name: Lillarious
#     start: AAAA-MM-JJ
#     end: AAAA-MM-JJ
